name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - name: Validate mirror sources
        run: |
          python3 -m py_compile mirror/sync.py
          python3 -c 'import tomllib, pathlib; tomllib.loads(pathlib.Path("mirror/packages.toml").read_text())'
          bash -n mirror/run-update.sh
          bash -n deploy.sh
          COPLO_DEPLOY_DIR=/tmp/coplo SITE_ADDRESS=:8080 \
            docker compose -f deploy/standalone/compose.yaml config >/dev/null
