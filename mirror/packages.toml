# Coplo APT package sources.
# Add or remove one [[package]] block to change the public repository contents.
# Add a [[suite]] block once when the repository starts supporting a new
# Debian/Ubuntu release. Distribution-aware packages match it automatically.
# A configuration change is detected automatically by the mirror updater.

[[suite]]
name = "bookworm"
family = "debian"
release_tokens = ["bookworm", "12"]
label = "Debian 12 / LMDE 6"

[[suite]]
name = "trixie"
family = "debian"
release_tokens = ["trixie", "13"]
label = "Debian 13 / LMDE 7"
default = true

[[suite]]
name = "jammy"
family = "ubuntu"
release_tokens = ["jammy", "22.04"]
label = "Ubuntu 22.04 LTS / Mint 21"

[[suite]]
name = "noble"
family = "ubuntu"
release_tokens = ["noble", "24.04"]
label = "Ubuntu 24.04 LTS / Mint 22"

[[suite]]
name = "resolute"
family = "ubuntu"
release_tokens = ["resolute", "26.04"]
label = "Ubuntu 26.04 LTS"

[[package]]
name = "zed"
enabled = true
repository = "gymZJ/zed-deb"
upstream_repository = "zed-industries/zed"
source_type = "packaged"
patterns = ["zed_*_amd64.deb", "zed_*_arm64.deb"]
homepage = "https://zed.dev/"
license = "GPL-3.0 / Apache-2.0"

