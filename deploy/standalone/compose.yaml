services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${COPLO_DEPLOY_DIR}/frontend:/srv/frontend:ro
      - ${COPLO_DEPLOY_DIR}/mirror:/srv/mirror:ro
      - ./data:/data
      - ./config:/config
